name: atmos_vg_gen
version: 0.1.0
description: >-
  Generate Dart / Flutter source from SVG via atmos_vector_graphics
  (GVG3), with optional HTML preview — by Atom735.
repository: https://github.com/Atom735/atmos_dart_pubs/tree/main/packages/atmos_vg_gen
issue_tracker: https://github.com/Atom735/atmos_dart_pubs/issues

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  args: ^2.4.0
  atmos_vector_graphics_core: ^0.1.0
  atmos_vector_graphics_xml: ^0.1.0
  path: ^1.8.0

dev_dependencies:
  atmos_lints: ^1.2.0
  test: ^1.24.0

executables:
  atmos_vg_gen: atmos_vg_gen

topics:
  - svg
  - codegen
  - vector
  - graphics
  - flutter
