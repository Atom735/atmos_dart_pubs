repository: https://github.com/Atom735/atmos_dart_pubs/tree/main/packages/atmos_vsc_theme
issue_tracker: https://github.com/Atom735/atmos_dart_pubs/issues

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  atmos_jsonc: ^0.1.0

dev_dependencies:
  atmos_lints: ^1.2.0
  test: ^1.24.0

topics:
  - theme
  - editor
  - json
  - vscode
