name: atmos_filesystem_web
version: 0.1.0
description: >-
  Browser File System Access adapter for atmos_filesystem by Atom735:
  directory-handle roots, URI mapping, read/write via FSA.
repository: https://github.com/Atom735/atmos_dart_pubs/tree/main/packages/atmos_filesystem_web
issue_tracker: https://github.com/Atom735/atmos_dart_pubs/issues

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  atmos_filesystem: ^0.1.0
  atmos_web_files_system_access_api: ^0.1.0
  atmos_web_js_utils: ^0.1.0

dev_dependencies:
  atmos_lints: ^1.2.0
  test: ^1.24.0

topics:
  - filesystem
  - web
  - browser
  - files
